name: Translations
on:
  pull_request: {}
  push:
    branches: [open_contracting]
jobs:
  i18n:
    uses: open-contracting/.github/.github/workflows/i18n-babel.yml@main
    permissions:
      contents: read
    with:
      command: |
        pybabel extract -F pyproject.toml -o standard_theme/locale/sphinx.pot -k '_ l_ lazy_gettext' .
        pybabel update -N -i standard_theme/locale/sphinx.pot -d standard_theme/locale -D sphinx
      dependencies: jinja2
